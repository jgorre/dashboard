<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Substacks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    /* ─── CUSTOM PROPERTIES ─── */
    :root {
      --bg-primary: #0a0a0b;
      --bg-secondary: #111113;
      --bg-card: #18181b;
      --bg-card-hover: #1f1f23;
      --bg-elevated: #222226;

      --text-primary: #fafafa;
      --text-secondary: #a1a1aa;
      --text-muted: #52525b;

      --accent: #8b5cf6;
      --accent-light: #a78bfa;
      --accent-glow: rgba(139, 92, 246, 0.4);
      --accent-subtle: rgba(139, 92, 246, 0.15);

      --border: #27272a;
      --border-light: #3f3f46;

      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-mono: 'JetBrains Mono', 'Fira Code', monospace;

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 24px;

      --speed-fast: 150ms ease;
      --speed-base: 250ms ease;
      --speed-slow: 400ms cubic-bezier(0.16, 1, 0.3, 1);
      --speed-bounce: 500ms cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* ─── RESET ─── */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* ─── BODY ─── */
    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 16px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
      min-height: 100vh;
      cursor: default;
    }

    /* ─── VIGNETTE OVERLAY ─── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: radial-gradient(
        ellipse 80% 60% at 50% 40%,
        transparent 0%,
        rgba(0, 0, 0, 0.15) 50%,
        rgba(0, 0, 0, 0.4) 100%
      );
    }

    /* ─── AMBIENT PARTICLES (canvas) ─── */
    #particles {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* ─── SCROLLBAR ─── */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-secondary); }
    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    /* ─── LAYOUT ─── */
    .page {
      position: relative;
      z-index: 1;
      max-width: 960px;
      margin: 0 auto;
      padding: 2rem 2rem 4rem;
    }

    /* ─── HEADER ─── */
    .header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 2.5rem;
      animation: fadeSlideIn 0.6s ease both;
    }

    .header-left {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .header-title {
      font-size: 1.75rem;
      font-weight: 600;
      background: linear-gradient(135deg, #fafafa 0%, var(--accent-light) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header-subtitle {
      font-family: var(--font-mono);
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .header-clock {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--text-muted);
      letter-spacing: 0.05em;
    }

    /* ─── SEARCH ─── */
    .search-wrap {
      position: relative;
      margin-bottom: 2rem;
      animation: fadeSlideIn 0.6s ease 0.1s both;
    }

    .search-icon {
      position: absolute;
      left: 1.25rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 1rem;
      pointer-events: none;
      transition: color var(--speed-base);
    }

    .search-input {
      width: 100%;
      height: 52px;
      padding: 0 1.25rem 0 3rem;
      background: var(--bg-card);
      border: 2px solid var(--border);
      border-radius: var(--radius-lg);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 1rem;
      outline: none;
      transition: border-color var(--speed-base), box-shadow var(--speed-base);
    }

    .search-input::placeholder {
      color: var(--text-muted);
    }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-subtle);
    }

    .search-input:focus ~ .search-icon {
      color: var(--accent-light);
    }

    /* ─── CATEGORY CHIPS ─── */
    .categories {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 2rem;
      animation: fadeSlideIn 0.6s ease 0.15s both;
    }

    .chip {
      padding: 0.4rem 1rem;
      border-radius: var(--radius-xl);
      background: var(--bg-elevated);
      border: 1px solid var(--border-light);
      color: var(--text-secondary);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--speed-base);
      user-select: none;
    }

    .chip:hover {
      background: var(--accent-subtle);
      border-color: var(--accent);
      color: var(--text-primary);
    }

    .chip.active {
      background: var(--accent-subtle);
      border-color: var(--accent);
      color: var(--accent-light);
      box-shadow: 0 0 12px var(--accent-subtle);
    }

    /* ─── CARDS GRID ─── */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.25rem;
    }

    /* ─── CARD ─── */
    .card {
      position: relative;
      display: flex;
      flex-direction: column;
      background: linear-gradient(180deg, var(--bg-card) 0%, rgba(20, 20, 23, 1) 100%);
      border: 1px solid rgba(39, 39, 42, 0.6);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
      overflow: hidden;
      transition: transform var(--speed-slow), box-shadow var(--speed-slow), border-color var(--speed-base), background var(--speed-base);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03), 0 2px 8px rgba(0, 0, 0, 0.3);
      animation: cardIn var(--speed-slow) both;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent-light), var(--accent));
      background-size: 200% 100%;
      opacity: 0;
      transition: opacity var(--speed-base);
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(139, 92, 246, 0.3);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.05),
        0 8px 30px rgba(0, 0, 0, 0.4),
        0 0 40px rgba(139, 92, 246, 0.08);
      background: linear-gradient(180deg, var(--bg-card-hover) 0%, rgba(24, 24, 27, 1) 100%);
    }

    .card:hover::before {
      opacity: 1;
      animation: shimmer 3s ease-in-out infinite;
    }

    .card:active {
      transform: translateY(-1px) scale(0.98);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.03),
        0 2px 8px rgba(0, 0, 0, 0.3);
    }

    .card-emoji {
      font-size: 2rem;
      margin-bottom: 0.75rem;
      line-height: 1;
      filter: saturate(0.85);
      transition: transform var(--speed-bounce), filter var(--speed-base);
    }

    .card:hover .card-emoji {
      transform: scale(1.15) rotate(-5deg);
      filter: saturate(1);
    }

    .card-name {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 0.35rem;
      transition: color var(--speed-base);
    }

    .card:hover .card-name {
      color: #fff;
    }

    .card-author {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--accent-light);
      margin-bottom: 0.6rem;
      letter-spacing: 0.02em;
    }

    .card-description {
      font-size: 0.85rem;
      color: var(--text-secondary);
      line-height: 1.5;
      flex: 1;
    }

    .card-tag {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.2rem 0.6rem;
      border-radius: var(--radius-xl);
      background: var(--accent-subtle);
      border: 1px solid rgba(139, 92, 246, 0.2);
      font-size: 0.7rem;
      font-weight: 500;
      color: var(--accent-light);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .card-arrow {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      font-size: 1rem;
      color: var(--text-muted);
      transition: transform var(--speed-base), color var(--speed-base);
    }

    .card:hover .card-arrow {
      transform: translate(4px, -2px);
      color: var(--accent-light);
    }

    /* ─── EMPTY STATE (no search results) ─── */
    .empty-results {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 1rem;
      animation: fadeSlideIn 0.4s ease both;
    }

    .empty-results-icon {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      animation: float 3s ease-in-out infinite;
    }

    .empty-results-text {
      font-size: 1.1rem;
      color: var(--text-muted);
    }

    /* ─── STAGGERED CARD ANIMATION ─── */
    .card:nth-child(1)  { animation-delay: 0.05s; }
    .card:nth-child(2)  { animation-delay: 0.10s; }
    .card:nth-child(3)  { animation-delay: 0.15s; }
    .card:nth-child(4)  { animation-delay: 0.20s; }
    .card:nth-child(5)  { animation-delay: 0.25s; }
    .card:nth-child(6)  { animation-delay: 0.30s; }
    .card:nth-child(7)  { animation-delay: 0.35s; }
    .card:nth-child(8)  { animation-delay: 0.40s; }
    .card:nth-child(9)  { animation-delay: 0.45s; }
    .card:nth-child(10) { animation-delay: 0.50s; }
    .card:nth-child(11) { animation-delay: 0.55s; }
    .card:nth-child(12) { animation-delay: 0.60s; }

    /* ─── KEYFRAMES ─── */
    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(18px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes shimmer {
      0%   { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-10px); }
    }

    @keyframes breathe {
      0%, 100% { opacity: 0.4; }
      50%      { opacity: 1; }
    }

    /* ─── RESPONSIVE ─── */
    @media (max-width: 600px) {
      .page { padding: 1.5rem 1rem 3rem; }
      .header-title { font-size: 1.4rem; }
      .cards-grid { grid-template-columns: 1fr; }
      .card { padding: 1.25rem; }
    }

    /* ─── FOCUS VISIBLE ─── */
    .card:focus-visible {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-subtle), 0 0 40px rgba(139, 92, 246, 0.1);
    }

    .chip:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px var(--accent-subtle);
    }

    /* ─── KEYBOARD HINT ─── */
    .keyboard-hint {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      font-size: 0.75rem;
      color: var(--text-muted);
      opacity: 0;
      animation: fadeSlideIn 0.6s ease 1.2s both;
      pointer-events: none;
      z-index: 10;
    }

    .keyboard-hint kbd {
      display: inline-block;
      padding: 0.1rem 0.4rem;
      background: var(--bg-elevated);
      border: 1px solid var(--border-light);
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--text-secondary);
    }
  </style>
</head>
<body>
  <canvas id="particles"></canvas>

  <div class="page">
    <!-- HEADER -->
    <header class="header">
      <div class="header-left">
        <h1 class="header-title">Reading List</h1>
        <span class="header-subtitle" id="date-display"></span>
      </div>
      <span class="header-clock" id="clock"></span>
    </header>

    <!-- SEARCH -->
    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input
        class="search-input"
        type="text"
        placeholder="Search substacks…"
        id="search"
        autocomplete="off"
        spellcheck="false"
      />
    </div>

    <!-- CATEGORY CHIPS -->
    <div class="categories" id="categories"></div>

    <!-- CARDS -->
    <div class="cards-grid" id="cards-grid"></div>
  </div>

  <!-- KEYBOARD HINT -->
  <div class="keyboard-hint">
    <kbd>/</kbd> to search &nbsp;·&nbsp; <kbd>Esc</kbd> to clear
  </div>

  <script>
    // ─── SUBSTACK DATA ───
    const substacks = [
      // ── Deep AI ──
      {
        name: "Import AI",
        author: "Jack Clark",
        emoji: "🤖",
        url: "https://importai.substack.com",
        description: "Weekly insights on artificial intelligence research, policy, and industry trends.",
        category: "Deep AI"
      },
      {
        name: "Ahead of AI",
        author: "Sebastian Raschka",
        emoji: "🧠",
        url: "https://magazine.sebastianraschka.com",
        description: "Deep dives into ML research papers, LLM architectures, and training techniques.",
        category: "Deep AI"
      },
      {
        name: "The Gradient",
        author: "The Gradient Team",
        emoji: "📐",
        url: "https://thegradient.pub",
        description: "Perspectives on AI research, machine learning, and the future of intelligence.",
        category: "Deep AI"
      },
      {
        name: "The Batch",
        author: "Andrew Ng",
        emoji: "🔬",
        url: "https://deeplearning.ai/the-batch",
        description: "Weekly AI news and insights from the founder of deeplearning.ai and Coursera.",
        category: "Deep AI"
      },
      // ── Data Engineering ──
      {
        name: "Seattle Data Guy",
        author: "Benjamin Rogojan",
        emoji: "🛠️",
        url: "https://seattledataguy.substack.com",
        description: "Practical data engineering, system design, and career advice from the trenches.",
        category: "Data Engineering"
      },
      {
        name: "Joe Reis's Substack",
        author: "Joe Reis",
        emoji: "🏗️",
        url: "https://joereis.substack.com",
        description: "Opinionated takes on data engineering fundamentals, architecture, and the modern data stack.",
        category: "Data Engineering"
      },
      {
        name: "Data Engineering Weekly",
        author: "Ananth Packkildurai",
        emoji: "📬",
        url: "https://dataengineeringweekly.substack.com",
        description: "Curated roundup of the best data engineering articles, tools, and trends each week.",
        category: "Data Engineering"
      },
      // ── Developing with AI ──
      {
        name: "One Useful Thing",
        author: "Ethan Mollick",
        emoji: "🔮",
        url: "https://oneusefulthing.substack.com",
        description: "Practical insights on AI's impact on work, education, and everyday life.",
        category: "Developing with AI"
      },
      {
        name: "Latent Space",
        author: "Swyx & Alessio",
        emoji: "🌀",
        url: "https://latentspace.substack.com",
        description: "The AI engineer newsletter. Technical deep dives on building with LLMs and AI tooling.",
        category: "Developing with AI"
      },
      {
        name: "Simon Willison's Weblog",
        author: "Simon Willison",
        emoji: "⚡",
        url: "https://simonwillison.net",
        description: "Hands-on experiments and tutorials with LLMs, prompt engineering, and AI-powered dev tools.",
        category: "Developing with AI"
      },
      {
        name: "The Neuron",
        author: "The Neuron Team",
        emoji: "🧬",
        url: "https://theneuron.substack.com",
        description: "Daily AI news distilled into actionable insights for builders and developers.",
        category: "Developing with AI"
      },
      // ── Philosophy ──
      {
        name: "Astral Codex Ten",
        author: "Scott Alexander",
        emoji: "🌌",
        url: "https://astralcodexten.substack.com",
        description: "Psychiatry, rationality, futurism, and everything in between. Long-form essays.",
        category: "Philosophy"
      },
      {
        name: "The Intrinsic Perspective",
        author: "Erik Hoel",
        emoji: "🔭",
        url: "https://erikhoel.substack.com",
        description: "Neuroscience, consciousness, and the philosophy of mind from a working scientist.",
        category: "Philosophy"
      },
      {
        name: "The Honest Broker",
        author: "Ted Gioia",
        emoji: "📖",
        url: "https://tedgioia.substack.com",
        description: "Culture, music, technology, and the life of the mind. Contrarian and deeply thoughtful.",
        category: "Philosophy"
      },
      {
        name: "Noahpinion",
        author: "Noah Smith",
        emoji: "💡",
        url: "https://noahpinion.substack.com",
        description: "Economics, technology, and geopolitics explored through a philosophical and analytical lens.",
        category: "Philosophy"
      }
    ];

    // ─── RENDER HELPERS ───
    const grid = document.getElementById('cards-grid');
    const searchInput = document.getElementById('search');
    const categoriesEl = document.getElementById('categories');

    const allCategories = ['All', ...new Set(substacks.map(s => s.category))];
    let activeCategory = 'All';

    function renderCategories() {
      categoriesEl.innerHTML = allCategories.map(cat => `
        <button class="chip ${cat === activeCategory ? 'active' : ''}" data-category="${cat}">
          ${cat}
        </button>
      `).join('');
    }

    function renderCards(filter = '', category = 'All') {
      const q = filter.toLowerCase();
      const filtered = substacks.filter(s => {
        const matchesSearch = !q ||
          s.name.toLowerCase().includes(q) ||
          s.author.toLowerCase().includes(q) ||
          s.description.toLowerCase().includes(q) ||
          s.category.toLowerCase().includes(q);
        const matchesCategory = category === 'All' || s.category === category;
        return matchesSearch && matchesCategory;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="empty-results">
            <div class="empty-results-icon">🔍</div>
            <div class="empty-results-text">No substacks match your search</div>
          </div>
        `;
        return;
      }

      grid.innerHTML = filtered.map(s => `
        <a class="card" href="${s.url}" target="_blank" rel="noopener noreferrer">
          <span class="card-arrow">↗</span>
          <div class="card-emoji">${s.emoji}</div>
          <div class="card-name">${s.name}</div>
          <div class="card-author">${s.author}</div>
          <div class="card-description">${s.description}</div>
          <span class="card-tag">${s.category}</span>
        </a>
      `).join('');
    }

    // ─── EVENTS ───
    searchInput.addEventListener('input', () => {
      renderCards(searchInput.value, activeCategory);
    });

    categoriesEl.addEventListener('click', e => {
      const btn = e.target.closest('.chip');
      if (!btn) return;
      activeCategory = btn.dataset.category;
      renderCategories();
      renderCards(searchInput.value, activeCategory);
    });

    // Keyboard shortcuts
    document.addEventListener('keydown', e => {
      if (e.key === '/' && document.activeElement !== searchInput) {
        e.preventDefault();
        searchInput.focus();
      }
      if (e.key === 'Escape') {
        searchInput.value = '';
        searchInput.blur();
        activeCategory = 'All';
        renderCategories();
        renderCards();
      }
    });

    // ─── CLOCK & DATE ───
    function updateTime() {
      const now = new Date();
      const timeStr = now.toLocaleTimeString('en-US', {
        hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
      });
      document.getElementById('clock').textContent = timeStr;
    }

    function setDate() {
      const now = new Date();
      const dateStr = now.toLocaleDateString('en-US', {
        weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
      });
      document.getElementById('date-display').textContent = dateStr;
    }

    setDate();
    updateTime();
    setInterval(updateTime, 1000);

    // ─── PARTICLE CANVAS ───
    (function initParticles() {
      const canvas = document.getElementById('particles');
      const ctx = canvas.getContext('2d');
      let particles = [];
      const PARTICLE_COUNT = 60;

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }

      function createParticle() {
        return {
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          r: Math.random() * 1.5 + 0.3,
          dx: (Math.random() - 0.5) * 0.15,
          dy: (Math.random() - 0.5) * 0.1,
          opacity: Math.random() * 0.3 + 0.05,
          pulse: Math.random() * Math.PI * 2,
          pulseSpeed: Math.random() * 0.008 + 0.003,
          hue: Math.random() > 0.7 ? 260 : 0, // some purple, most white
        };
      }

      function init() {
        resize();
        particles = Array.from({ length: PARTICLE_COUNT }, createParticle);
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (const p of particles) {
          p.x += p.dx;
          p.y += p.dy;
          p.pulse += p.pulseSpeed;

          // Wrap around
          if (p.x < -5) p.x = canvas.width + 5;
          if (p.x > canvas.width + 5) p.x = -5;
          if (p.y < -5) p.y = canvas.height + 5;
          if (p.y > canvas.height + 5) p.y = -5;

          const currentOpacity = p.opacity * (0.6 + 0.4 * Math.sin(p.pulse));
          const color = p.hue === 260
            ? `hsla(260, 70%, 72%, ${currentOpacity})`
            : `hsla(0, 0%, 90%, ${currentOpacity})`;

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = color;
          ctx.fill();
        }

        requestAnimationFrame(draw);
      }

      window.addEventListener('resize', resize);
      init();
      draw();
    })();

    // ─── INIT ───
    renderCategories();
    renderCards();
  </script>
</body>
</html>
